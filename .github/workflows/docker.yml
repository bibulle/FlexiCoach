name: Docker image

# Reusable workflow: builds the Docker image and, when asked, pushes it to
# Docker Hub and updates the GitOps repository.
#   - pull request   -> build-and-publish.yml : build only (nothing is pushed)
#   - merge on main  -> not called (no image is built nor pushed)
#   - release (tag)  -> release-please.yml    : push ":latest" + ":VX.Y.Z" and update GitOps

on:
  workflow_call:
    inputs:
      push:
        description: Push the image to Docker Hub
        type: boolean
        default: false
      version:
        description: Release version (X.Y.Z). Empty = no versioned tag, no GitOps update
        type: string
        default: ''
      ref:
        description: Git ref to build (defaults to the triggering commit)
        type: string
        default: ''

env:
  APP_NAME: flexicoach
  APP_PATH: ./application
  OPS_PATH: ./gitops
  K8S_FILE: flexicoach/30-deployment.yaml

jobs:
  docker:
    name: Build Docker image${{ inputs.push && ' and push' || '' }}${{ inputs.version != '' && format(' (V{0})', inputs.version) || '' }}
    runs-on: ubuntu-latest

    env:
      actions_token: ${{ secrets.ACTIONS_TOKEN }}
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          path: ${{ env.APP_PATH }}

      - name: Compute Docker tags
        id: tags
        run: |
          can_push=${{ inputs.push && env.dockerhub_username != '' && env.dockerhub_password != '' }}
          if [ "$can_push" = "true" ]; then
            tags="${{ env.dockerhub_username }}/${{ env.APP_NAME }}:latest"
            if [ -n "${{ inputs.version }}" ]; then
              tags="$tags,${{ env.dockerhub_username }}/${{ env.APP_NAME }}:V${{ inputs.version }}"
            fi
          else
            tags="${{ env.APP_NAME }}:ci"
          fi
          echo "push=$can_push" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Docker tags: $tags (push=$can_push)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.dockerhub_username }}
          password: ${{ env.dockerhub_password }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_PATH }}
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}

      # GitOps: only for a release, so the cluster always runs a tagged version
      - name: Checkout gitops
        if: inputs.version != '' && steps.tags.outputs.push == 'true' && env.actions_token != ''
        uses: actions/checkout@v6
        with:
          repository: bibulle/myKubernetesConfig
          token: ${{ env.actions_token }}
          path: ${{ env.OPS_PATH }}

      - name: Update k8s yaml file
        id: update_yml
        if: inputs.version != '' && steps.tags.outputs.push == 'true' && env.actions_token != ''
        run: |
          cd ${{ env.OPS_PATH }}
          image="bibulle\/${{ env.APP_NAME }}"
          sed -i "s/image: ${image}:.*/image: ${image}:V${{ inputs.version }}/g" ${{ env.K8S_FILE }}
          echo "line_modified=$(git status -s | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Commit k8s yaml file
        if: steps.update_yml.outputs.line_modified != '' && steps.update_yml.outputs.line_modified != '0'
        run: |
          cd ${{ env.OPS_PATH }}
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "${GITHUB_ACTOR}"
          git commit -am "Update version of ${{ env.APP_NAME }} (${{ inputs.version }})"
          git push
