name: Build and Publish

on:
  # run it on push to the default repository branch
  push:
    branches:
      - 'main'

  # run it during pull request
  pull_request:

env:
  APP_NAME: flexicoach
  VERSION: 0.0.0
  APP_PATH: ./application
  OPS_PATH: ./gitops
  K8S_FILE: flexicoach/30-deployment.yaml

jobs:
  # Run tests before building
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npx nx test backend

      - name: Run frontend unit tests
        run: npx nx test frontend

  # Backend end-to-end tests against a real MongoDB
  e2e-backend:
    name: Run backend e2e tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017/flexicoach-e2e
      JWT_SECRET: e2e-secret
      ADMIN_EMAILS: admin@example.com
      GOOGLE_CLIENT_ID: e2e.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: e2e
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
      FRONTEND_URL: http://localhost:4200
      # Registration is limited to 3 requests/hour: disabled for the e2e run only
      THROTTLE_DISABLED: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npx nx build backend

      - name: Start backend
        run: |
          node dist/apps/backend/main.js > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api && exit 0
            sleep 1
          done
          echo "Backend did not start" && cat backend.log && exit 1

      - name: Run backend e2e tests
        run: npx nx e2e-dev backend-e2e

      - name: Backend logs
        if: failure()
        run: cat backend.log

  # Build and publish docker image (only after tests pass)
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    needs: [test, e2e-backend]
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-latest

    env:
        actions_token: ${{ secrets.ACTIONS_TOKEN }}
        dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
        dockerhub_password: ${{ secrets.DOCKERHUB_TOKEN }}

    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{env.APP_PATH}}

      - name: Checkout gitops
        uses: actions/checkout@v6
        if: ${{ env.actions_token != '' }}
        with:
          repository: bibulle/myKubernetesConfig
          token: ${{ env.actions_token }}
          path: ${{env.OPS_PATH}}

      - name: Read package.json
        id: read_package_json
        run: |
          echo "PACKAGE_JSON=$(jq -c . < ${{env.APP_PATH}}/package.json)" >> $GITHUB_ENV

      - name: Retrieve values from package.json
        id: retrieve_package_json
        run: |
          echo "VERSION=${{fromJson(env.PACKAGE_JSON).version}}" >> $GITHUB_ENV

      - name: Calculate docker tags
        if: ${{ env.dockerhub_username != '' && env.dockerhub_password != '' }}
        run : |
          echo "DOCKER_TAGS=${{env.dockerhub_username}}/${{env.APP_NAME}}:latest, ${{env.dockerhub_username}}/${{env.APP_NAME}}:V${{env.VERSION}}" >> $GITHUB_ENV

      - name: Calculate docker tags
        if: ${{ env.dockerhub_username == '' || env.dockerhub_password == '' }}
        run : |
          echo "DOCKER_TAGS=${{env.APP_NAME}}:latest" >> $GITHUB_ENV

      - run: |
          echo "Building : ${{env.APP_NAME}}:${{env.VERSION}}"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        id: login_dockerhub
        uses: docker/login-action@v4
        if: ${{ env.dockerhub_username != '' && env.dockerhub_password != '' }}
        with:
          username: ${{ env.dockerhub_username }}
          password: ${{ env.dockerhub_password }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ${{env.APP_PATH}}
          push: ${{ env.dockerhub_username != '' && env.dockerhub_password != '' }}
          tags: ${{env.DOCKER_TAGS}}

      - name: Update k8s yaml file
        id: update_yml
        if: ${{ env.actions_token != '' }}
        run: |
          cd ${{env.OPS_PATH}}
          image="bibulle\/${{env.APP_NAME}}"
          sed -i "s/image: ${image}:.*/image: ${image}:V${{env.VERSION}}/g" ${{env.K8S_FILE}}
          status=`git status -s | wc -l | bc`
          echo "line_modified=$status" >> $GITHUB_OUTPUT

      - name: Commit k8s yaml file
        id: commit_yml
        if: env.actions_token != '' && steps.update_yml.outputs.line_modified != '0'
        run: |
          cd ${{env.OPS_PATH}}
          git config --global user.email "${GITHUB_ACTOR}"
          git config --global user.name "${GITHUB_ACTOR}@users.noreply.github.com"
          git add .
          git commit -am "Update version of ${{env.APP_NAME}} (${{env.VERSION}})"
          git push
