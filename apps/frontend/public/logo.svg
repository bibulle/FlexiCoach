<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>

    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#94A3B8" flood-opacity="0.15"/>
    </filter>

    <filter id="curveShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#E2E8F0" stroke-width="18"/>

  <g stroke="#E2E8F0" stroke-width="6">
    <line x1="256" y1="56" x2="256" y2="80"/>
    <line x1="456" y1="256" x2="432" y2="256"/>
    <line x1="256" y1="456" x2="256" y2="432"/>
    <line x1="56" y1="256" x2="80" y2="256"/>
  </g>

  <path d="M140 330
           C200 290, 240 310, 290 250
           S360 210, 390 190"
        fill="none"
        stroke="url(#grad)"
        stroke-width="24"
        stroke-linecap="round"
        filter="url(#curveShadow)"/>

  <circle cx="140" cy="330" r="10" fill="#A7F3D0"/>
  <circle cx="390" cy="190" r="16" fill="#86EFAC"/>

</svg>
