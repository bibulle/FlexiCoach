<div class="user-menu">
  @if (currentUser()) {
    <button class="user-menu-trigger" (click)="toggleMenu()" type="button">
      <span class="user-avatar" [class.has-image]="currentUser()?.avatar">
        @if (currentUser()?.avatar) {
          <img [src]="currentUser()?.avatar" alt="Avatar" />
        } @else {
          {{ getInitials() }}
        }
      </span>
      <span class="user-name">{{ getDisplayName() }}</span>
      <span class="dropdown-icon">▼</span>
    </button>

    @if (isMenuOpen()) {
      <div class="user-menu-dropdown">
        <div class="user-info">
          <div class="user-email">{{ currentUser()?.email }}</div>
        </div>
        @if (authService.isAdmin()) {
          <hr>
          <button class="menu-item menu-item-admin" (click)="toggleAdminMode()" type="button">
            <span>Mode administration</span>
            <span class="toggle-indicator" [class.active]="authService.isAdminMode()">
              {{ authService.isAdminMode() ? 'ON' : 'OFF' }}
            </span>
          </button>
        }
        <hr>
        <button class="menu-item" (click)="logout()" type="button">
          Déconnexion
        </button>
      </div>
    }
  }
</div>
