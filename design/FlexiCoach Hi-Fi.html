<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlexiCoach — Hi-fi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hifi/design-system.css">
<style>
  body { margin: 0; background: #0e0f12; color: #f3f4f6; font-family: var(--font-sans); }
  .showcase { padding: 40px 32px 80px; max-width: 1480px; margin: 0 auto; }
  .showcase-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; }
  .showcase-head h1 { font-family: var(--font-sans); font-size: 36px; font-weight: 700; letter-spacing: -0.02em; margin: 0; color: #f8fafc; }
  .showcase-head .crumb { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #9ca3af; }
  .showcase-head a { color: var(--primary-400, #60a5fa); text-decoration: none; }
  .showcase-head a:hover { text-decoration: underline; }
  .showcase-lead { color: #cbd5e1; max-width: 720px; margin: 6px 0 40px; line-height: 1.6; font-size: 15px; }

  .screen-section { margin-bottom: 56px; }
  .screen-head { display: flex; gap: 14px; align-items: baseline; margin-bottom: 8px; }
  .screen-head .num { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: #93c5fd; padding: 4px 9px; border: 1.5px solid #3b6fb6; border-radius: 6px; background: rgba(59,111,182,0.12); }
  .screen-head h2 { font-size: 24px; font-weight: 700; margin: 0; color: #f1f5f9; letter-spacing: -0.01em; }
  .screen-sub { color: #94a3b8; max-width: 600px; margin: 0 0 24px; font-size: 14px; }

  .frames { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
  .frame-wrap { display: flex; flex-direction: column; gap: 10px; }
  .frame-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #6b7280; }

  .mobile-frame {
    width: 390px; height: 844px;
    border: 10px solid #1c1d22;
    border-radius: 44px;
    overflow: hidden; position: relative;
    background: var(--surface);
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px #2d2e33;
  }
  .desktop-frame {
    flex: 1 1 820px;
    min-width: 820px; max-width: 1080px;
    border: 1px solid #2d2e33;
    border-radius: 16px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: 0 24px 60px -24px rgba(0,0,0,0.5);
  }
  .desktop-chrome {
    background: #f8fafc;
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .desktop-chrome .dots { display: flex; gap: 6px; }
  .desktop-chrome .dots span { width: 12px; height: 12px; border-radius: 6px; background: #d1d5db; }
  .desktop-chrome .dots span:nth-child(1) { background: #f87171; }
  .desktop-chrome .dots span:nth-child(2) { background: #fbbf24; }
  .desktop-chrome .dots span:nth-child(3) { background: #34d399; }
  .desktop-chrome .url {
    flex: 1; text-align: center;
    font-family: var(--font-mono); font-size: 12px; color: var(--ink-3);
    background: white; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
  }
  .desktop-screen { height: 720px; overflow: auto; background: var(--surface); color: var(--ink-2); }
  .mobile-screen { height: 100%; overflow: auto; background: var(--surface); color: var(--ink-2); }
  /* mobile notch */
  .mobile-frame::before {
    content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 28px; background: #1c1d22; border-radius: 16px; z-index: 5;
  }

  hr.divider { border: none; border-top: 1px solid #1f2024; margin: 64px 0 48px; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="hifi/primitives.jsx"></script>
<script type="text/babel" src="hifi/screen-home.jsx"></script>
<script type="text/babel" src="hifi/screen-calendar.jsx"></script>
<script type="text/babel" src="hifi/screen-player.jsx"></script>
<script type="text/babel" src="hifi/screen-auth.jsx"></script>
<script type="text/babel" src="hifi/screen-completion.jsx"></script>
<script type="text/babel" src="hifi/screen-routine-list.jsx"></script>
<script type="text/babel" src="hifi/screen-editor.jsx"></script>
<script type="text/babel" src="hifi/screen-settings.jsx"></script>

<script type="text/babel">
function App() {
  const Screen = ({ num, title, sub, mobile, desktop, mobileLabel = 'iPhone · 390', desktopLabel = 'Desktop · 1024+' }) => (
    <section className="screen-section" data-screen-label={`${num} ${title}`}>
      <div className="screen-head">
        <span className="num">{num}</span>
        <h2>{title}</h2>
      </div>
      <p className="screen-sub">{sub}</p>
      <div className="frames">
        <div className="frame-wrap">
          <div className="mobile-frame"><div className="mobile-screen">{mobile}</div></div>
          <div className="frame-label">{mobileLabel}</div>
        </div>
        <div className="frame-wrap" style={{ flex: '1 1 820px' }}>
          <div className="desktop-frame">
            <div className="desktop-chrome">
              <div className="dots"><span /><span /><span /></div>
              <div className="url">flexicoach.app</div>
            </div>
            <div className="desktop-screen">{desktop}</div>
          </div>
          <div className="frame-label">{desktopLabel}</div>
        </div>
      </div>
    </section>
  );

  return (
    <div className="showcase">
      <div className="showcase-head">
        <div>
          <div className="crumb">Hi-fi · v1.0</div>
          <h1>FlexiCoach — Hi-fi.</h1>
        </div>
        <a href="FlexiCoach Refined.html">← retour wireframes</a>
      </div>
      <p className="showcase-lead">
        Huit écrans clés en haute fidélité, mobile + desktop. Design system : Inter / JetBrains Mono, palette bleu-forêt, tokens CSS et composants prêts à porter en Angular. Voir <a href="HANDOFF.md" style={{ color: 'var(--primary-400)' }}>HANDOFF.md</a> pour le mapping vers le code.
      </p>

      <Screen
        num="01"
        title="Accueil — anneaux de vitalité"
        sub="Trois objectifs concentriques (temps, série, routine du jour) + grille de routines. Le triple anneau est le point focal ; tout converge vers le bouton « Reprendre »."
        mobile={<window.HomeHiFi_Mobile />}
        desktop={<window.HomeHiFi_Desktop />}
      />

      <hr className="divider" />

      <Screen
        num="02"
        title="Routines — catalogue"
        sub="Liste filtrable des routines (built-in + perso). Bouton « Nouvelle routine » pour les admins. Chaque carte porte sa couleur de tag, son niveau et son nombre d'étapes."
        mobile={<window.RoutineListHiFi_Mobile />}
        desktop={<window.RoutineListHiFi_Desktop />}
      />

      <hr className="divider" />

      <Screen
        num="03"
        title="Lecteur — timeline parcourue"
        sub="Mode focus pendant la séance. Timeline horizontale colorée par mode (respiration / mouvement / statique) en haut, chrono géant au centre, prochaine étape et contrôles en bas."
        mobile={<window.PlayerHiFi_Mobile />}
        desktop={<window.PlayerHiFi_Desktop />}
      />

      <hr className="divider" />

      <Screen
        num="04"
        title="Fin de séance — célébration"
        sub="Validation immédiate (check vert), récap durée + étapes + série, sélecteur d'humeur, note libre. Boutons : voir calendrier / refaire."
        mobile={<window.CompletionHiFi_Mobile />}
        desktop={<window.CompletionHiFi_Desktop />}
      />

      <hr className="divider" />

      <Screen
        num="05"
        title="Calendrier — tendance + heatmap"
        sub="Vue annuelle. Une courbe d'évolution mensuelle au-dessus pour la macro, une heatmap GitHub-like dessous pour le détail jour par jour."
        mobile={<window.CalHiFi_Mobile />}
        desktop={<window.CalHiFi_Desktop />}
      />

      <hr className="divider" />

      <Screen
        num="06"
        title="Éditeur de routine"
        sub="Liste des étapes draggable à gauche, panneau de détail à droite (desktop) ou modal (mobile). Édite nom, durée, mode, consigne, et annonces vocales horodatées."
        mobile={<window.EditorHiFi_Mobile />}
        desktop={<window.EditorHiFi_Desktop />}
      />

      <hr className="divider" />

      <Screen
        num="07"
        title="Stats + Paramètres"
        sub="Vue 30 jours : série, temps cumulé, régularité, top routines. Rappels (heures + jours), réglages voix (vitesse, volume), thème clair/sombre/auto."
        mobile={<window.SettingsHiFi_Mobile />}
        desktop={<window.SettingsHiFi_Desktop />}
      />

      <hr className="divider" />

      <Screen
        num="08"
        title="Auth — Connexion / Inscription"
        sub="Connexion email/mdp + Google OAuth. Desktop : split-screen avec panneau de marque dégradé. Mobile : formulaire centré pleine largeur."
        mobile={<window.LoginHiFi_Mobile />}
        desktop={<window.LoginHiFi_Desktop />}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
